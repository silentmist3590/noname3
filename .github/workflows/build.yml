name: Build CloudStream Plugins

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Build with Gradle
        run: gradle make --warning-mode all

      - name: Prepare builds directory
        run: |
          mkdir -p builds
          find . -name "*.cs3" -exec cp -v {} builds/ \;

      - name: Generate plugin files
        run: |
          python3 - <<'EOF'
          import json, os, zipfile
          
          plugins = []
          builds_dir = 'builds'
          
          for file in os.listdir(builds_dir):
              if file.endswith('.cs3'):
                  file_path = os.path.join(builds_dir, file)
                  try:
                      with zipfile.ZipFile(file_path, 'r') as z:
                          manifest_name = 'manifest.json' if 'manifest.json' in z.namelist() else 'plugin.json'
                          
                          if manifest_name in z.namelist():
                              with z.open(manifest_name) as f:
                                  manifest = json.load(f)
                                  
                                  plugin_class = manifest.get('pluginClassName', manifest.get('internalName', 'com.lagradost.Unknown'))
                                  plugin_name = manifest.get('name', file.replace('.cs3', ''))
                                  
                                  # ⭐ TỰ ĐỘNG ĐỌC VERSION TỪ FILE .cs3 (Không ép buộc nữa)
                                  real_version = int(manifest.get('version', 1))
                                  
                                  raw_tv_types = manifest.get('tvTypes', ["Movie", "TvSeries"])
                                  valid_tv_types = []
                                  for t in raw_tv_types:
                                      if t in ["Movie", "TvSeries", "Cartoon", "Anime", "Documentary", "AsianDrama", "Live", "Others"]:
                                          valid_tv_types.append(t)
                                  if not valid_tv_types:
                                      valid_tv_types = ["Movie", "TvSeries"]

                                  url = f"https://raw.githubusercontent.com/silentmist3590/noname3/builds/{file}"
                                  
                                  # internalName chuẩn của CloudStream = tên module (tên file .cs3), không phải tên class
                                  internal_name = file.replace('.cs3', '')

                                  plugins.append({
                                      "name": plugin_name,
                                      "internalName": internal_name,
                                      "version": real_version, # Dùng version thật
                                      # App cũ (4.5.x) cần 2 trường này; thiếu -> mặc định 0 -> plugin bị coi là "Down"/vô hiệu hóa
                                      "status": int(manifest.get('status', 1)) or 1,
                                      "apiVersion": 1,
                                      "fileSize": os.path.getsize(file_path),
                                      "description": manifest.get('description', f"Plugin {plugin_name}"),
                                      "authors": manifest.get('authors', ["Silentmist3590"]),
                                      "repositoryUrl": "https://github.com/silentmist3590/noname3",
                                      "url": url,
                                      "iconUrl": "",
                                      "tvTypes": valid_tv_types,
                                      "language": manifest.get('language', "en")
                                  })
                  except Exception as e:
                      print(f"Lỗi khi đọc file {file}: {e}")

          with open(os.path.join(builds_dir, 'plugins.json'), 'w') as f:
              json.dump(plugins, f, indent=2)

          repo_data = {
              "name": "Noname CloudStream Repository",
              "description": "Kho plugin phim tiếng Việt",
              "manifestVersion": 1,
              "pluginLists": [
                  "https://raw.githubusercontent.com/silentmist3590/noname3/builds/plugins.json"
              ]
          }

          with open(os.path.join(builds_dir, 'repo.json'), 'w') as f:
              json.dump(repo_data, f, indent=2)
          EOF

      - name: Deploy to builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./builds
          publish_branch: builds
          force_orphan: true
